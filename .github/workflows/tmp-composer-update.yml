name: tmp composer update
on:
  push:
    branches: [chore/composer-update]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-update]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: composer outdated --direct --no-interaction || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add composer.lock composer.json
          git commit -m "chore(deps): composer update [skip-update]" || echo "no changes"
          git push
